name: 构建 JM漫画导出 APK

on:
  workflow_dispatch:        # 支持手动触发（仓库页面 Actions 标签页）
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Android SDK / NDK r25b
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl -sSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mv /tmp/cmdline/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: 安装 python-for-android
        run: pip install python-for-android

      - name: 构建 APK（约 30~60 分钟）
        run: bash build_apk_ci.sh

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: jm-export-apk
          path: |
            bin/*.apk
            dists/*/bin/*.apk
          if-no-files-found: error
